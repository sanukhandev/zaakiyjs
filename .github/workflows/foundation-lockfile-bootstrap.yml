name: One-time M0 lockfile refresh
on:
  push:
    branches: [chore/foundation-contracts-bootstrap]
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/chore/foundation-contracts-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/foundation-contracts-bootstrap
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate reproducible workspace lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/foundation-lockfile-bootstrap.yml
          git diff --cached --quiet && exit 1
          git commit -m "chore: refresh frozen lockfile for root contract consumers"
          git push origin HEAD:chore/foundation-contracts-bootstrap
