name: Agent Skills
on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'scripts/agent-skills/**'
      - '.github/workflows/agent-skills.yml'
      - 'docs/development/agent-skills.md'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'scripts/agent-skills/**'
      - '.github/workflows/agent-skills.yml'
permissions:
  contents: read
jobs:
  skill-contract:
    name: skills / portable skill and installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: node --test scripts/agent-skills/skill.test.mjs
      - run: node .agents/skills/zaakiyjs-builder/scripts/inspect.mjs --project .
      - run: node .agents/skills/zaakiyjs-builder/scripts/install.mjs --agent all --project . --dry-run
