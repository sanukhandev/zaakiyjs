name: B1 Forms and Analytics Comparative Benchmarks

on:
  push:
    branches: [perf/b0-b1-package-benchmarks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 62800aad999beafa22d0bb5b884ee28575e7ffc5
          path: .benchmark-performance-base
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build and test candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vitest run packages/forms/test packages/analytics/test
          # Full lint is validated independently in Quality; the frozen nested
          # checkout is intentionally excluded from the candidate lint scan.
          pnpm typecheck
      - name: Build immutable PR 62 baseline
        run: |
          pnpm --dir .benchmark-performance-base install --frozen-lockfile
          pnpm --dir .benchmark-performance-base build
      - name: Compare identical public API fixtures
        run: |
          mkdir -p benchmark-artifacts
          node benchmarks/microbench-b1.mjs .benchmark-performance-base benchmark-artifacts/b1-before.json
          node benchmarks/microbench-b1.mjs . benchmark-artifacts/b1-after.json
          node benchmarks/report-b1.mjs
          node benchmarks/microbench-b0-services.mjs .benchmark-performance-base benchmark-artifacts/b0-services-before.json
          node benchmarks/microbench-b0-services.mjs . benchmark-artifacts/b0-services-after.json
          node benchmarks/report-b0-services.mjs
          node benchmarks/microbench-b0-stage2.mjs .benchmark-performance-base benchmark-artifacts/b0-stage2-before.json
          node benchmarks/microbench-b0-stage2.mjs . benchmark-artifacts/b0-stage2-after.json
          node benchmarks/report-b0-stage2.mjs
          cat benchmark-artifacts/b1-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-artifacts/b0-services-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-artifacts/b0-stage2-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-forms-analytics-comparison
          path: benchmark-artifacts/
          if-no-files-found: warn
