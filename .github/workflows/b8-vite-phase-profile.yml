name: B8 Vite Production Phase Profiling

on:
  pull_request:
    paths:
      - 'packages/vite-plugin/**'
      - 'packages/compiler/**'
      - 'packages/styles/**'
      - 'benchmarks/microbench-vite-phase-profile.mjs'
      - 'benchmarks/report-vite-phase-profile.mjs'
      - '.github/workflows/b8-vite-phase-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout frozen consolidated optimization baseline
        uses: actions/checkout@v4
        with:
          ref: 54b130ed57632be777e264ba255cef8cb8e5b2c1
          path: .benchmark-b5
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build candidate and lint profiling instrumentation
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vitest run packages/vite-plugin/test
          pnpm exec eslint benchmarks/microbench-vite-phase-profile.mjs benchmarks/report-vite-phase-profile.mjs
      - name: Build frozen baseline
        run: |
          pnpm --dir .benchmark-b5 install --frozen-lockfile
          pnpm --dir .benchmark-b5 build
      - name: Profile matched production builds
        run: |
          mkdir -p benchmark-artifacts
          node benchmarks/microbench-vite-phase-profile.mjs .benchmark-b5 benchmark-artifacts/b8-vite-frozen.json
          node benchmarks/microbench-vite-phase-profile.mjs . benchmark-artifacts/b8-vite-candidate.json
          node benchmarks/report-vite-phase-profile.mjs
          cat benchmark-artifacts/b8-vite-phase-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw build phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b8-vite-phase-profiling
          path: benchmark-artifacts/
          if-no-files-found: warn