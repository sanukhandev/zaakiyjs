name: H4 Hydration Reference Builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/h4-hydration/**'
      - 'packages/compiler/**'
      - 'packages/ssr/**'
      - '.github/workflows/h4-hydration-reference.yml'
  push:
    branches: ['feat/production-hardening-integration']
    paths:
      - 'benchmarks/h4-hydration/**'
      - 'packages/compiler/**'
      - 'packages/ssr/**'
      - '.github/workflows/h4-hydration-reference.yml'

permissions:
  contents: read

concurrency:
  group: h4-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-references:
    name: h4 / React Vue Zaakiy production fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build frozen ZaakiyJS workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install exact direct React Vue dependencies and retain resolved graph
        run: |
          npm ci --prefix benchmarks/h4-hydration/reference --ignore-scripts --no-audit --no-fund
          mkdir -p benchmark-artifacts/h4-hydration-sites
          cp benchmarks/h4-hydration/reference/package-lock.json benchmark-artifacts/h4-hydration-sites/reference-generated-lock.json
      - name: Compile independent React Vue SSR and browser hydration
        env:
          H4_SITE: benchmark-artifacts/h4-hydration-sites
          NODE_ENV: production
        run: node benchmarks/h4-hydration/reference/build.mjs
      - name: Compile ZaakiyJS H4 SSR from exact PR head
        env:
          H4_SITE: benchmark-artifacts/h4-hydration-sites
          NODE_ENV: production
        run: node benchmarks/h4-hydration/build-zaakiy.mjs
      - name: Verify generated baseline HTML and expose certified gaps
        run: |
          python3 -m py_compile benchmarks/h4-hydration/measure.py
          for framework in react vue zaakiyjs; do
            for size in 100 1000 10000; do
              test -s "benchmark-artifacts/h4-hydration-sites/$framework/$size/index.html"
            done
          done
          node -e "const f=require('./benchmark-artifacts/h4-hydration-sites/zaakiyjs-build.json');if(f.rejectedCases.length||f.generatedCases.length!==3)throw Error('H4 compiler SSR scale gate failed: '+JSON.stringify(f))"
          echo 'React/Vue/ZaakiyJS reference build successful.'
          echo 'Build-only evidence: full four-framework browser matrix and pinned transitive lock are separate gates.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable reference sources, resolved graph and production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-reference-build-${{ github.sha }}
          path: benchmark-artifacts/h4-hydration-sites/
          if-no-files-found: warn
          retention-days: 14

  compile-angular:
    name: h4 / Angular AOT SSR hydration reference
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Angular 21 direct references and record resolved lock
        run: |
          npm ci --prefix benchmarks/h4-hydration/angular --no-audit --no-fund
          mkdir -p benchmark-artifacts/h4-angular
          cp benchmarks/h4-hydration/angular/package-lock.json benchmark-artifacts/h4-angular/generated-lock.json
      - name: AOT compile true Angular server and client hydration bundles
        run: npm run build --prefix benchmarks/h4-hydration/angular -- --base-href /angular/
      - name: Verify Angular server-pre-rendered HTML for every workload
        run: |
          set -e
          for size in 100 1000 10000; do
            test -s "benchmarks/h4-hydration/angular/dist/browser/$size/index.html"
            grep -q "data-key" "benchmarks/h4-hydration/angular/dist/browser/$size/index.html"
          done
          cp -R benchmarks/h4-hydration/angular/dist/browser benchmark-artifacts/h4-angular/browser
      - name: Upload independently built Angular SSR reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-angular-reference-${{ github.sha }}
          path: benchmark-artifacts/h4-angular/
          if-no-files-found: warn
          retention-days: 14

  measure-all:
    name: h4 / strict four-framework three-browser hydration matrix
    needs: [compile-references, compile-angular]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: h4-reference-build-${{ github.sha }}
          path: benchmark-artifacts/h4-hydration-sites
      - uses: actions/download-artifact@v4
        with:
          name: h4-angular-reference-${{ github.sha }}
          path: benchmark-artifacts/h4-angular
      - name: Assemble byte-pinned Angular application and 4x3 manifest
        shell: bash
        env:
          H4_SITE: benchmark-artifacts/h4-hydration-sites
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts/h4-hydration-sites/angular
          cp -a benchmark-artifacts/h4-angular/browser/. benchmark-artifacts/h4-hydration-sites/angular/
          cp benchmark-artifacts/h4-angular/generated-lock.json benchmark-artifacts/h4-hydration-sites/angular-generated-lock.json
          node benchmarks/h4-hydration/assemble-manifest.mjs
      - name: Install exact three Playwright browser engines
        run: bash scripts/ci/install-playwright-browsers.sh
      - name: Strict production hydration correctness and latency measurements
        run: |
          python3 benchmarks/h4-hydration/measure.py \
            --site benchmark-artifacts/h4-hydration-sites \
            --output benchmark-artifacts/h4-hydration-matrix.json \
            --head "${{ github.sha }}" --warmups 10 --samples 50
      - name: Upload full and incomplete evidence without fabricating results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-hydration-comparative-matrix-${{ github.sha }}
          path: |
            benchmark-artifacts/h4-hydration-matrix.json
            benchmark-artifacts/h4-hydration-sites/build-manifest.json
          if-no-files-found: warn
          retention-days: 14
