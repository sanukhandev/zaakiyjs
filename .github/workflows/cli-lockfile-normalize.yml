name: Temporary CLI lockfile normalization
on:
  push:
    branches: [feat/foundation-cli]
permissions:
  contents: write
jobs:
  normalize-lock:
    if: github.ref == 'refs/heads/feat/foundation-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/foundation-cli
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile deterministically
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen lockfile before committing
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Remove self and commit corrected lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/cli-lockfile-normalize.yml
          git diff --cached --quiet && exit 1
          git commit -m "chore(cli): regenerate pnpm lockfile for integrated foundation"
          git push origin HEAD:feat/foundation-cli
