name: CLI Generated App Acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  generated-app:
    name: cli / generated-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Build merged framework and CLI
        run: pnpm build
      - name: Run complete CLI package tests
        run: pnpm --filter @zaakiyjs/cli test
      - name: Scaffold a genuine app in the pnpm workspace
        run: node packages/cli/dist/bin.js start --project smoke-app --template minimal --workspace --path apps --package-manager pnpm
      - name: Resolve test app workspace dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Strict generated TypeScript check
        run: pnpm --dir apps/smoke-app typecheck
      - name: Compile real TSX and generated CSS through Vite
        run: pnpm --dir apps/smoke-app build
      - name: Exercise generated Counter in real headless Chromium
        shell: bash
        run: |
          command -v google-chrome
          python3 - <<'PY'
          from pathlib import Path
          file = Path("apps/smoke-app/dist/index.html")
          html = file.read_text()
          test_script = """<script type="module">
          document.addEventListener("DOMContentLoaded", () => {
            const button = document.querySelector("button");
            const before = button?.textContent ?? "";
            button?.click();
            setTimeout(() => {
              const after = button?.textContent ?? "";
              document.body.setAttribute("data-zaakiy-counter",
                before.includes("Count: 0") && after.includes("Count: 1") ? "pass" : "fail");
            }, 80);
          });
          </script>"""
          assert "</body>" in html
          file.write_text(html.replace("</body>", test_script + "</body>"))
          PY
          pnpm --dir apps/smoke-app exec vite preview --host 127.0.0.1 --port 4173 > /tmp/zaakiy-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=3000 --dump-dom http://127.0.0.1:4173/ \
            > /tmp/zaakiy-browser-dom.txt 2>/tmp/zaakiy-browser-stderr.txt
          if ! grep -q 'data-zaakiy-counter="pass"' /tmp/zaakiy-browser-dom.txt; then
            cat /tmp/zaakiy-preview.log
            cat /tmp/zaakiy-browser-stderr.txt
            cat /tmp/zaakiy-browser-dom.txt
            exit 1
          fi
      - name: Compile and exercise native Show and For in Chromium
        shell: bash
        run: |
          cat > apps/smoke-app/src/App.tsx <<'TSX'
          import { Show, For } from "@zaakiyjs/core";
          import { signal } from "@zaakiyjs/signals";
          const visible = signal(true);
          const rows = signal([{ id: "a", label: "Alpha" }, { id: "b", label: "Beta" }]);
          export function App() {
            return <main>
              <button id="toggle" onClick={() => {visible.value = !visible.value;}}>toggle</button>
              <button id="reorder" onClick={() => {rows.value = [...rows.value].reverse();}}>reorder</button>
              <button id="replace" onClick={() => {rows.value = rows.value.map(
                row => row.id === "a" ? {id:"a",label:"Alpha2"} : row
              );}}>replace</button>
              <Show when={visible.value} fallback={<p id="hidden">Hidden</p>}><p id="shown">Shown</p></Show>
              <ol><For each={rows.value} by={row => row.id}>{row => <li><span>{row.label}</span></li>}</For></ol>
            </main>;
          }
          TSX
          pnpm --dir apps/smoke-app typecheck
          pnpm --dir apps/smoke-app build
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/smoke-app/dist/index.html")
          html = path.read_text()
          script = """<script type="module">
          document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
              const originals = [...document.querySelectorAll("ol li")];
              const initial = originals.map(node => node.textContent).join(",");
              document.querySelector("#toggle")?.click();
              document.querySelector("#reorder")?.click();
              document.querySelector("#replace")?.click();
              setTimeout(() => {
                const next = [...document.querySelectorAll("ol li")];
                const ok = originals.length === 2 &&
                  initial === "Alpha,Beta" &&
                  document.querySelector("#hidden")?.textContent === "Hidden" &&
                  !document.querySelector("#shown") &&
                  next[0] === originals[1] && next[1] === originals[0] &&
                  next.map(node => node.textContent).join(",") === "Beta,Alpha2";
                document.body.setAttribute("data-zaakiy-control-flow", ok ? "pass" : "fail");
              }, 120);
            }, 60);
          });
          </script>"""
          assert "</body>" in html
          path.write_text(html.replace("</body>", script + "</body>"))
          PY
          pnpm --dir apps/smoke-app exec vite preview --host 127.0.0.1 --port 4174 > /tmp/zaakiy-control-flow-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=3000 --dump-dom http://127.0.0.1:4174/ \
            > /tmp/zaakiy-control-flow-browser.txt 2>/tmp/zaakiy-control-flow-stderr.txt
          if ! grep -q 'data-zaakiy-control-flow="pass"' /tmp/zaakiy-control-flow-browser.txt; then
            cat /tmp/zaakiy-control-flow-preview.log
            cat /tmp/zaakiy-control-flow-stderr.txt
            cat /tmp/zaakiy-control-flow-browser.txt
            exit 1
          fi
      - name: Assert generated artifacts and no build tool imports in browser code
        shell: bash
        run: |
          test -f apps/smoke-app/dist/index.html
          find apps/smoke-app/dist -type f
          if grep -R -E '@zaakiyjs/(ai|proxy|compiler|vite-plugin)' apps/smoke-app/dist/assets --include='*.js'; then
            echo 'Unexpected build-time package reference in browser assets'
            exit 1
          fi
