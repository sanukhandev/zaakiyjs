name: npm Release Certification and Staging
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact certified current main commit (version PR or reviewed CI-only correction)
        required: true
        type: string
      mode:
        type: choice
        options: [dry-run, stage]
        default: dry-run
      confirmation:
        description: For stage only, enter STAGE APPROVED RELEASE
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: npm-release-main
  cancel-in-progress: false
jobs:
  certify:
    if: github.ref == 'refs/heads/main' && github.repository == 'sanukhandev/zaakiyjs'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main and passing post-merge CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/release/release-ci.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci
      - run: node --test scripts/release/version-policy.test.mjs scripts/release/npm-stage.test.mjs scripts/release/release-ci.test.mjs
      - run: pnpm audit --prod --audit-level high
      - name: Strict certification of exact tarballs
        env:
          ZAAKIY_RELEASE_ARCHIVES: .generated/npm-release/archives
          ZAAKIY_RELEASE_REPORT: .generated/npm-release/packed-consumer-report.json
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node scripts/release/verify-packages.mjs --enforce-release
          node scripts/release/npm-stage.mjs dry-run .generated/npm-release
      - uses: actions/upload-artifact@v4
        with:
          name: certified-npm-artifacts
          path: .generated/npm-release/
          if-no-files-found: error
          retention-days: 14
  stage:
    needs: certify
    if: inputs.mode == 'stage' && inputs.confirmation == 'STAGE APPROVED RELEASE' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --global npm@11.21.3 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: certified-npm-artifacts
          path: .generated/npm-release
      - name: Verify exact main and stage only approved packages with OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          NPM_STAGE_AUTHORIZED: 'true'
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$RELEASE_SHA"
          node scripts/release/npm-stage.mjs stage .generated/npm-release
