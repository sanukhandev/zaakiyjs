name: B8 Compiler Stage Profiling

on:
  pull_request:
    paths:
      - 'packages/compiler/**'
      - 'benchmarks/microbench-compiler-stages.mjs'
      - 'benchmarks/report-compiler-stages.mjs'
      - '.github/workflows/b8-compiler-stage-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-stage-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 54b130ed57632be777e264ba255cef8cb8e5b2c1
          path: .benchmark-b5
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build and test current compiler
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vitest run packages/compiler/test
          pnpm exec eslint benchmarks/microbench-compiler-stages.mjs benchmarks/report-compiler-stages.mjs
      - name: Build frozen compiler
        run: |
          pnpm --dir .benchmark-b5 install --frozen-lockfile
          pnpm --dir .benchmark-b5 build
      - name: Profile matching compiler stage fixtures
        run: |
          mkdir -p benchmark-artifacts
          node benchmarks/microbench-compiler-stages.mjs .benchmark-b5 benchmark-artifacts/compiler-stages-frozen.json
          node benchmarks/microbench-compiler-stages.mjs . benchmark-artifacts/compiler-stages-candidate.json
          node benchmarks/report-compiler-stages.mjs
          cat benchmark-artifacts/compiler-stage-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw stage profiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b8-compiler-stages
          path: benchmark-artifacts/
          if-no-files-found: warn