name: Router Match Performance Experiment
on:
  push:
    branches: [experiment/router-precomputed-match]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 04f453c18b31c7f900d77b037b0548f8888826f1
          path: .benchmark-hardening
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build and run full tests against router changes
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm lint
          pnpm typecheck
      - name: Build hardening reference
        run: |
          pnpm --dir .benchmark-hardening install --frozen-lockfile
          pnpm --dir .benchmark-hardening build
      - name: Compare router match latency
        run: |
          mkdir -p benchmark-artifacts
          node benchmarks/microbench-router.mjs .benchmark-hardening benchmark-artifacts/router-hardening.json
          node benchmarks/microbench-router.mjs . benchmark-artifacts/router-experiment.json
      - name: Upload raw experiment data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-precomputed-match
          path: benchmark-artifacts/
          if-no-files-found: warn
